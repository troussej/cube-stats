<p-panel class="max-w-sm">
    <ng-template pTemplate="header">
        <h3>Round {{ roundNumber() }}</h3>
    </ng-template>

    <p-table [value]="roundGames()" size="small" showGridline>
        <ng-template #header>
            <tr>

            </tr>
        </ng-template>
        <ng-template #body let-game>
            <tr>

                <td [class]="getClasses(1,game)">{{ game.player1 }}</td>
                <td>{{ game.score1}} - {{game.score2 }}</td>
                <td [class]="getClasses(2,game)">{{ game.player2 }}</td>

            </tr>
        </ng-template>
    </p-table>
</p-panel>
