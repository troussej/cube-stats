<div class="grid 2xl:grid-cols-5 gap-2 mt-1 ">
    <div class="2xl:col-span-3">
        <ng-content />

        <div class=" mt-2">
            <p-table [value]="draftSession().players" sortField="score" [sortOrder]="-1">
                <ng-template #header>
                    <tr>
                        <th></th>
                        <th></th>
                        <th></th>
                        <th></th>
                    </tr>
                </ng-template>
                <ng-template #body let-player>
                    <tr>
                        <td>{{ player.name }}</td>
                        <td>
                            <app-deck-tag [deckDescription]="player.deck"></app-deck-tag>
                        </td>
                        <td class="whitespace-nowrap">{{ player.wins }}&nbsp;-&nbsp;{{ player.losses }}&nbsp;-&nbsp;{{
                            player.draws }}</td>
                        <td><app-elo-change [elo]="totalEloChange(player, draftSession())"></app-elo-change></td>
                    </tr>
                </ng-template>
            </p-table>

        </div>
    </div>

    <div class="2xl:col-span-2 grid grid-cols-1 gap-2  ">
        <app-round-result [draftSession]="draftSession()" [roundNumber]="1"></app-round-result>
        <app-round-result [draftSession]="draftSession()" [roundNumber]="2"></app-round-result>
        <app-round-result [draftSession]="draftSession()" [roundNumber]="3"></app-round-result>
    </div>
</div>
