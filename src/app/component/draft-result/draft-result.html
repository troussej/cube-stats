<div class="grid lg:grid-cols-2 gap-2 mt-1">
    <div class="col-span-1">
        <ng-content />

        <div class="mt-2">

            @for(player of draftSession().players; track player) {

            <p> {{ player.name }} :
                <app-deck-tag [deckDescription]="player.deck"></app-deck-tag>
            </p>
            }
        </div>
    </div>

    <div class="col-span-1 grid grid-cols-1 gap-2">

        <app-round-result [draftSession]="draftSession()" [roundNumber]="1"></app-round-result>
        <app-round-result [draftSession]="draftSession()" [roundNumber]="2"></app-round-result>
        <app-round-result [draftSession]="draftSession()" [roundNumber]="3"></app-round-result>
    </div>
</div>
