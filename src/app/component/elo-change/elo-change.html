@if(elo() && elo()?.elo){
<div class="flex items-center  justify-between   gap-1 " [pTooltip]="diff()">
    @if(showOld()){
    <div class="">
        {{elo()!.oldElo}}
    </div>
    }

    <div>
        @if(changeDir() ===0){
        <svg data-p-icon="arrow-right"></svg>
        }@else if(changeDir()>0){
        <svg data-p-icon="arrow-up-right"></svg>
        }@else{
        <svg data-p-icon="arrow-down-right"></svg>
        }

    </div>
    <div>
        {{elo()!.elo}}
    </div>



</div>
}
