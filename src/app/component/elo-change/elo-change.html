@if(elo() && elo()?.elo){

<div class="inline-flex items-center gap-1">
    <div>

        {{elo()!.oldElo}}
    </div>

    <div>
        @if(changeDir() ===0){
        <svg data-p-icon="arrow-right"></svg>

        }@else if(changeDir()>0){

        <svg data-p-icon="arrow-up-right"></svg>

        }@else{

        <svg data-p-icon="arrow-down-right"></svg>

        }
    </div>

    <div>

        {{elo()!.elo}}
    </div>
</div>
}
