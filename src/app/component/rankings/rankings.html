<p-fieldset class="" legend="Classement" toggleable="true">



    <div class="flex justify-left  gap-4 m-2 text-sm">
        <label for="switch">Actif dans les {{config.nbMoisActif}} derniers mois</label>
        <p-toggleswitch [(ngModel)]="actif" [size]="'small'" [className]="'p-toggleswitch-sm'"></p-toggleswitch>

    </div>

    <p-tree-table [value]="nodes()" size="small" scrollable="true" tableStyleClass="">
        <ng-template #header>
            <tr class="">
                <th colspan="2">Joueur·euse</th>
                <th>Elo</th>
                <th>MàJ</th>
            </tr>
        </ng-template>
        <ng-template #body let-rowNode let-stat="rowData">
            <tr [ttRow]="rowNode">
                @if(stat.chart){
                <td colspan="4">
                    <app-player-elo-chart [player]="stat.player"></app-player-elo-chart>
                </td>
                }@else {
                <td colspan="2">
                    <div class="inline-flex items-center gap-2">
                        <p-treetable-toggler [rowNode]="rowNode" />
                        {{ stat.name }}
                        @if(stat.oppData){
                        r{{stat.round}} vs {{ stat.oppData.player }} ({{stat.oppData.oldElo}})
                        }
                    </div>
                </td>
                <td>
                    <app-elo-change [elo]="stat.elo" class=""></app-elo-change>
                    @if(stat.eloValue){
                    {{stat.eloValue}}
                    }
                </td>

                <td>{{ stat.date | date:'dd/MM/yyyy' }}</td>
                }
            </tr>
        </ng-template>
    </p-tree-table>
</p-fieldset>
