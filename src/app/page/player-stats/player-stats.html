<div class="m-4">
    <div class="my-4 flex gap-2">
        <button pButton (click)="router.navigate([''])" severity="secondary">
            <svg data-p-icon="home"></svg>
            Retour
        </button>
        <div class="w-full">
            <app-player-picker [names]="names()" (namesChange)="changePlayer($event)"></app-player-picker>
        </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
        <div class="col-span-1 lg:col-span-3 lg:order-last  ">
            <app-player-elo-chart [players]="names()"></app-player-elo-chart>
        </div>
        <div class="grid col-span-1 lg:col-span-1 gap-4">
            @for(name of names();track name){
            <div class="">
                <p-panel>
                    <ng-content #header>
                        Statistiques de <b>{{ name }}</b>
                    </ng-content>
                    <ng-content #content>

                        <p-table [value]="draftPlayers()[name]" size="small" [sortField]="'date'" [sortOrder]="-1">
                            <ng-template #header>
                                <tr>

                                    <th pSortableColumn="deck">Deck&nbsp;<p-sort-icon field="deck" /></th>
                                    <th pSortableColumn="date">Date&nbsp;<p-sort-icon field="date" /></th>
                                    <th pSortableColumn="score">Rés.&nbsp;<p-sort-icon field="score" /></th>
                                    <th>Elo</th>
                                </tr>
                            </ng-template>
                            <ng-template #body let-data>
                                <tr>

                                    <td>
                                        <app-deck-tag [deckDescription]="data.deck"
                                            [deckImg]="data.deckImg"></app-deck-tag>
                                    </td>
                                    <td>{{ data.draftId }}</td>
                                    <td class="whitespace-nowrap">{{ data.player.result()}}

                                    </td>
                                    <td><app-elo-change [showOld]="false"
                                            [elo]="playerService.totalEloChange(data.player,data.draft)"></app-elo-change>
                                    </td>
                                </tr>
                            </ng-template>
                        </p-table>
                    </ng-content>
                </p-panel>
            </div>
            }
        </div>

    </div>
</div>
