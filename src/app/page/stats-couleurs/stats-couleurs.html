<div class="m-4">

    <!-- <p-panel header="Stats couleurs">
        <ng-content #body> -->
    <div class="grid grid-cols-6 gap-4">
        <div class="col-span-1 grid grid-rows-2 grid-cols-1">
            <div class="">
                <p-card header="Présence des couleurs dans les decks draftés">
                    <div class="">
                        <canvas baseChart [data]="buildPieChartData(colorRepartitionStats())" [type]="'doughnut'"
                            [options]="options" class="" [plugins]="plugins!"> </canvas>
                    </div>
                </p-card>
            </div>
            <div class="">
                <p-card header="Winrate de chacune des couleurs">
                    <div class="">
                        <canvas baseChart [data]="buildPieChartData(colorWinrateStats())" [type]="'doughnut'"
                            [options]="options" class="" [plugins]="plugins!"> </canvas>
                    </div>
                </p-card>
            </div>
        </div>
        <div class="col-span-5">
            <p-card header="Répartition des combinaisons de couleurs">
                <div class="">
                    <p-selectbutton [options]="comboSortOrderOptions" [(ngModel)]="combosSortOrder" optionLabel="label"
                        optionValue="value" aria-labelledby="basic" />
                    <canvas baseChart [data]="buildBarChartData(colorComboRepartitionStats())" [type]="'bar'"
                        [options]="optionsBar" class="" [plugins]="plugins!"> </canvas>
                </div>
            </p-card>
        </div>
    </div>
    <!--</ng-content>
     </p-panel> -->
</div>
