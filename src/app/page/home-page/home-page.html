<div class="grid grid-cols-2 m-4 gap-2">

    <div>

        <p-panel class="" header="Drafts">
            <p-select [(ngModel)]="selectedDraft" [options]="draftOptions()" optionValue="value"
                optionLabel="label"></p-select>
            @if(selectedDraft()){
            <app-draft-result [draftSession]="getSelectedDraft()!"></app-draft-result>
            }
        </p-panel>
    </div>

    <div class="">

        <app-rankings></app-rankings>
    </div>
</div>
