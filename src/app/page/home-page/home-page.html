<div class="grid lg:grid-cols-2 m-4 gap-2">

    <div>

        <p-fieldset class="" legend="Drafts" toggleable="true">

            @if(selectedDraft()){
            <app-draft-result [draftSession]="getSelectedDraft()!">
                <p-select class="mt-2" [(ngModel)]="selectedDraft" [options]="draftOptions()" optionValue="value"
                    optionLabel="label"></p-select>
            </app-draft-result>
            }
        </p-fieldset>
    </div>

    <div class="">

        <app-rankings></app-rankings>
    </div>
</div>
